<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şagird İşlərinin Qiymətləndirilməsi</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .auth-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .auth-container button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .auth-container button:hover {
            background-color: #2980b9;
        }

        .app-container {
            display: none;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        .card h3 {
            margin-bottom: 12px;
            color: #34495e;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card h3 span {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: normal;
        }

        /* Zoom Sahəsi */
        .img-box {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #1e1e1e;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-height: 420px;
            position: relative;
            cursor: grab;
            user-select: none;
        }

        .img-box:active {
            cursor: grabbing;
        }

        .img-box img {
            max-width: 100%;
            max-height: 100%;
            transform-origin: center center;
            transition: transform 0.05s ease-out;
        }

        .evaluation-panel {
            grid-column: span 2;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: space-between;
        }

        .student-info {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }

        .inputs-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .inputs-group select, .inputs-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background-color: white;
        }

        .inputs-group select {
            width: 120px;
            cursor: pointer;
            font-weight: bold;
        }

        .inputs-group textarea {
            width: 250px;
            height: 42px;
            resize: none;
        }

        .btn-submit {
            padding: 12px 25px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            background-color: #e74c3c;
            color: white;
        }

        .status-badge.checked {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <header>
        <h2>DİM Şagird İşlərinin Yoxlanılması Sistemi</h2>
        <span id="user-display">Müəllim Paneli</span>
    </header>

    <!-- Giriş Bölməsi -->
    <div class="auth-container" id="login-box">
        <h2>Sistemə Giriş</h2>
        <input type="password" id="passcode" placeholder="Müəllim şifrəsini daxil edin">
        <button id="btn-login">Daxil ol</button>
    </div>

    <!-- Qiymətləndirmə Paneli -->
    <div class="app-container" id="app-box">
        <div class="main-content">
            
            <!-- Tapşırıq Şərti və Meyar -->
            <div class="card">
                <h3>Meyar <span>(Diyircəklə zoom edin)</span></h3>
                <div class="img-box" id="box-criteria">
                    <img id="criteria-img" src="" alt="Meyar şəkli yüklənir...">
                </div>
            </div>

            <!-- Şagirdin Yazı İş -->
            <div class="card">
                <h3>Şagirdin Cavab Vərəqi <span>(Diyircəklə zoom edin)</span></h3>
                <div class="img-box" id="box-work">
                    <img id="work-img" src="" alt="Şagirdin yazı işi yüklənir...">
                </div>
            </div>

            <!-- Qiymətləndirmə Formu -->
            <div class="evaluation-panel">
                <div>
                    <div class="student-info" id="student-name">Şagird: -</div>
                    <span id="status-tag" class="status-badge">Yoxlanılmayıb</span>
                </div>

                <div class="inputs-group">
                    <!-- Combobox (Xal Seçimi) -->
                    <select id="score-select">
                        <option value="">Xal seçin</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>

                    <textarea id="feedback-input" placeholder="Qeyd və ya rəy..."></textarea>
                    <button class="btn-submit" id="btn-save">Yadda Saxla və Növbəti</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase CDN Kitabxanaları -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqiyZq7ML-X0VmWjuk1S4IXWzBVe2-BVs",
            authDomain: "sagird-yoxlama-sistemi.firebaseapp.com",
            databaseURL: "https://sagird-yoxlama-sistemi-default-rtdb.firebaseio.com",
            projectId: "sagird-yoxlama-sistemi",
            storageBucket: "sagird-yoxlama-sistemi.firebasestorage.app",
            messagingSenderId: "954607993567",
            appId: "1:954607993567:web:8943cacde746ba7f8d1f6a",
            measurementId: "G-MXZ41N92YF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let studentsKeys = [];
        let currentIndex = 0;
        let studentsData = {};

        // Giriş Düyməsi
        document.getElementById('btn-login').addEventListener('click', function() {
            const pass = document.getElementById('passcode').value;
            if (pass === "dim2026") {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('app-box').style.display = 'flex';
                loadStudentsData();
            } else {
                alert("Daxil edilən şifrə yanlışdır!");
            }
        });

        // Bazadan Məlumat Oxumaq
        async function loadStudentsData() {
            try {
                const studentsRef = ref(db, 'students');
                const snapshot = await get(studentsRef);

                if (snapshot.exists()) {
                    studentsData = snapshot.val();
                    studentsKeys = Object.keys(studentsData);
                    showStudent(currentIndex);
                } else {
                    alert("Bazada heç bir şagird məlumatı tapılmadı!");
                }
            } catch (err) {
                console.error(err);
                alert("Baza ilə əlaqə xətası yarandı: " + err.message);
            }
        }

        // Şagird Məlumatlarını Göstərmək
        function showStudent(index) {
            if (index >= studentsKeys.length) {
                alert("Təbrik edirik! Bütün şagirdlərin işləri yoxlanıldı.");
                return;
            }

            const key = studentsKeys[index];
            const student = studentsData[key];

            document.getElementById('student-name').innerText = `Şagird: ${student.name} (${index + 1}/${studentsKeys.length})`;
            
            document.getElementById('criteria-img').src = student.criteria_url;
            document.getElementById('work-img').src = student.work_url;
            
            // Şəkil miqyaslarını sıfırla
            resetZoom('criteria-img');
            resetZoom('work-img');

            document.getElementById('score-select').value = (student.score !== null && student.score !== undefined) ? student.score : '';
            document.getElementById('feedback-input').value = student.feedback || '';

            const statusTag = document.getElementById('status-tag');
            if (student.score !== null && student.score !== undefined) {
                statusTag.innerText = "Yoxlanılıb";
                statusTag.classList.add('checked');
            } else {
                statusTag.innerText = "Yoxlanılmayıb";
                statusTag.classList.remove('checked');
            }
        }

        // Yadda Saxla və Növbəti Düyməsi
        document.getElementById('btn-save').addEventListener('click', async function() {
            const score = document.getElementById('score-select').value;
            const feedback = document.getElementById('feedback-input').value;

            if (score === "") {
                alert("Lütfən xal seçin!");
                return;
            }

            const currentKey = studentsKeys[currentIndex];

            try {
                await set(ref(db, `students/${currentKey}/score`), Number(score));
                await set(ref(db, `students/${currentKey}/feedback`), feedback);

                studentsData[currentKey].score = Number(score);
                studentsData[currentKey].feedback = feedback;

                currentIndex++;
                showStudent(currentIndex);
            } catch (err) {
                alert("Xal bazaya yazılarkən xəta baş verdi: " + err.message);
            }
        });

        // ==========================================
        // MOUSE WHEEL ZOOM VƏ DRAG (SÜRÜŞDÜRMƏ) KODU
        // ==========================================
        function enableZoomAndPan(containerId, imgId) {
            const container = document.getElementById(containerId);
            const img = document.getElementById(imgId);

            let scale = 1;
            let pointX = 0;
            let pointY = 0;
            let startX = 0;
            let startY = 0;
            let isDragging = false;

            function updateTransform() {
                img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            }

            container.addEventListener('wheel', function(e) {
                e.preventDefault();
                const xs = (e.clientX - pointX) / scale;
                const ys = (e.clientY - pointY) / scale;
                const delta = -e.deltaY;

                (delta > 0) ? (scale *= 1.15) : (scale /= 1.15);
                scale = Math.min(Math.max(0.8, scale), 5); // Max 5x zoom

                updateTransform();
            });

            container.addEventListener('mousedown', function(e) {
                e.preventDefault();
                startX = e.clientX - pointX;
                startY = e.clientY - pointY;
                isDragging = true;
            });

            window.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                pointX = e.clientX - startX;
                pointY = e.clientY - startY;
                updateTransform();
            });

            window.addEventListener('mouseup', function() {
                isDragging = false;
            });

            img.dataset.reset = function() {
                scale = 1;
                pointX = 0;
                pointY = 0;
                updateTransform();
            };
        }

        function resetZoom(imgId) {
            const img = document.getElementById(imgId);
            if (img.dataset.reset) {
                img.dataset.reset();
            }
        }

        enableZoomAndPan('box-criteria', 'criteria-img');
        enableZoomAndPan('box-work', 'work-img');
    </script>
</body>
</html>
