<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şagird İşlərinin Qiymətləndirilməsi</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .auth-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .auth-container button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .auth-container button:hover {
            background-color: #2980b9;
        }

        .app-container {
            display: none;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        .card h3 {
            margin-bottom: 12px;
            color: #34495e;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
        }

        .img-box {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #fafafa;
            border: 1px solid #eee;
            border-radius: 6px;
            min-height: 250px;
        }

        .img-box img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }

        .evaluation-panel {
            grid-column: span 2;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: space-between;
        }

        .student-info {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }

        .inputs-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .inputs-group input, .inputs-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .inputs-group input[type="number"] {
            width: 100px;
        }

        .inputs-group textarea {
            width: 250px;
            height: 42px;
            resize: none;
        }

        .btn-submit {
            padding: 12px 25px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            background-color: #e74c3c;
            color: white;
        }

        .status-badge.checked {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <header>
        <h2>DİM Şagird İşlərinin Yoxlanılması Sistemi</h2>
        <span id="user-display">Müəllim Paneli</span>
    </header>

    <!-- Giriş Bölməsi -->
    <div class="auth-container" id="login-box">
        <h2>Sistemə Giriş</h2>
        <input type="password" id="passcode" placeholder="Müəllim şifrəsini daxil edin">
        <button onclick="login()">Daxil ol</button>
    </div>

    <!-- Qiymətləndirmə Paneli -->
    <div class="app-container" id="app-box">
        <div class="main-content">
            
            <!-- Tapşırıq Şərti və Meyar -->
            <div class="card">
                <h3>Tapşırıq Şərti və Qiymətləndirmə Meyarı</h3>
                <div class="img-box">
                    <img id="criteria-img" src="" alt="Meyar şəkli yüklənir...">
                </div>
            </div>

            <!-- Şagirdin Yazı İş -->
            <div class="card">
                <h3>Şagirdin Cavab Vərəqi</h3>
                <div class="img-box">
                    <img id="work-img" src="" alt="Şagirdin yazı işi yüklənir...">
                </div>
            </div>

            <!-- Qiymətləndirmə Formu -->
            <div class="evaluation-panel">
                <div>
                    <div class="student-info" id="student-name">Şagird: -</div>
                    <span id="status-tag" class="status-badge">Yoxlanılmayıb</span>
                </div>

                <div class="inputs-group">
                    <input type="number" id="score-input" placeholder="Xal (0-100)" min="0" max="100">
                    <textarea id="feedback-input" placeholder="Qeyd və ya rəy..."></textarea>
                    <button class="btn-submit" onclick="saveAndNext()">Yadda Saxla və Növbəti</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Konfiqurasiyası (Kopyaladığınız parametrləri bura yazın)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let studentsKeys = [];
        let currentIndex = 0;
        let studentsData = {};

        // Giriş funksiyası
        window.login = function() {
            const pass = document.getElementById('passcode').value;
            if (pass === "dim2026") { // Təyin etdiyiniz müəllim şifrəsi
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('app-box').style.display = 'flex';
                loadStudentsData();
            } else {
                alert("Daxil edilən şifrə yanlışdır!");
            }
        };

        // Bazadan məlumatları oxumaq
        async function loadStudentsData() {
            const studentsRef = ref(db, 'students');
            const snapshot = await get(studentsRef);

            if (snapshot.exists()) {
                studentsData = snapshot.val();
                studentsKeys = Object.keys(studentsData);
                showStudent(currentIndex);
            } else {
                alert("Bazada heç bir şagird məlumatı tapılmadı!");
            }
        }

        // Cari şagirdin məlumatlarını göstərmək
        function showStudent(index) {
            if (index >= studentsKeys.length) {
                alert("Təbrik edirik! Bütün şagirdlərin işləri yoxlanıldı.");
                return;
            }

            const key = studentsKeys[index];
            const student = studentsData[key];

            document.getElementById('student-name').innerText = `Şagird: ${student.name} (${index + 1}/${studentsKeys.length})`;
            document.getElementById('criteria-img').src = student.criteria_url;
            document.getElementById('work-img').src = student.work_url;
            
            document.getElementById('score-input').value = student.score !== null ? student.score : '';
            document.getElementById('feedback-input').value = student.feedback || '';

            const statusTag = document.getElementById('status-tag');
            if (student.score !== null && student.score !== undefined) {
                statusTag.innerText = "Yoxlanılıb";
                statusTag.classList.add('checked');
            } else {
                statusTag.innerText = "Yoxlanılmayıb";
                statusTag.classList.remove('checked');
            }
        }

        // Qiyməti bazaya yazmaq və növbətiyə keçmək
        window.saveAndNext = async function() {
            const score = document.getElementById('score-input').value;
            const feedback = document.getElementById('feedback-input').value;

            if (score === "") {
                alert("Lütfən qiymət daxil edin!");
                return;
            }

            const currentKey = studentsKeys[currentIndex];

            // Firebase-də məlumatı yeniləyirik
            await set(ref(db, `students/${currentKey}/score`), Number(score));
            await set(ref(db, `students/${currentKey}/feedback`), feedback);

            // Yerli məlumatı da yeniləyirik
            studentsData[currentKey].score = Number(score);
            studentsData[currentKey].feedback = feedback;

            currentIndex++;
            showStudent(currentIndex);
        };
    </script>
</body>
</html>
