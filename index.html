<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DİM Şagird İşlərinin Yoxlanılması Sistemi</title>
    <!-- Xarici Stil Faylı -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>DİM Şagird İşlərinin Yoxlanılması Sistemi</h2>
        <span id="user-display">Müəllim Paneli</span>
    </header>

    <!-- Giriş Bölməsi -->
    <div class="auth-container" id="login-box">
        <h2>Sistemə Giriş</h2>
        <input type="text" id="teacher-id" placeholder="Müəllim ID (məs: m1, m2, m3)">
        <input type="password" id="passcode" placeholder="Müəllim şifrəsini daxil edin">
        <button id="btn-login">Daxil ol</button>
    </div>

    <!-- Qiymətləndirmə Paneli -->
    <div class="app-container" id="app-box">
        <div class="main-content">
            
            <!-- Tapşırıq Şərti və Meyar -->
            <div class="card">
                <h3>Meyar <span>(Diyircəklə zoom edin)</span></h3>
                <div class="img-box" id="box-criteria">
                    <img id="criteria-img" src="" alt="Meyar şəkli yüklənir..." draggable="false">
                </div>
            </div>

            <!-- Şagirdin Yazı İş -->
            <div class="card">
                <h3>Şagirdin Cavab Vərəqi <span>(Diyircəklə zoom edin)</span></h3>
                <div class="img-box" id="box-work">
                    <img id="work-img" src="" alt="Şagirdin yazı işi yüklənir..." draggable="false">
                </div>
            </div>

            <!-- Qiymətləndirmə Formu -->
            <div class="evaluation-panel">
                <div>
                    <div class="student-info" id="student-name">Şagird: -</div>
                    <span id="status-tag" class="status-badge">Yoxlanılmayıb</span>
                </div>

                <div class="inputs-group">
                    <select id="score-select">
                        <option value="">Xal seçin</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>

                    <textarea id="feedback-input" placeholder="Qeyd və ya rəy..."></textarea>
                    <button class="btn-submit" id="btn-save">Yadda Saxla və Növbəti</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Xarici JavaScript Faylı -->
    <script type="module" src="app.js"></script>
</body>
</html>
